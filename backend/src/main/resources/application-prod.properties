# ==============================================================================
# RemotePrep — Production Configuration Profile (application-prod.properties)
# Designed for Standalone Windows Desktop Deployment
# ==============================================================================

# Server Configuration — Bound strictly to localhost
server.port=${PORT:8080}
server.address=127.0.0.1

# MySQL Database DataSource Configuration
# Environment variables allow local service configuration without modifying committed source code.
# Never commit plain-text passwords to version control.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:remoteprep}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Tuning for Desktop Instance
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
# 'validate' verifies schema against Java entities without mutating table structures
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Production File Logging Configuration
# Defaults to logs/remoteprep.log relative to working directory or user data directory
logging.file.name=${LOG_DIR:logs}/remoteprep.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Production Logging Levels (Suppress verbose framework debug output)
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.remoteprep=INFO

# Code Execution Engine Configuration
remoteprep.execution.java-compiler=${JAVA_COMPILER:javac}
remoteprep.execution.java-runtime=${JAVA_RUNTIME:java}
remoteprep.execution.c-compiler=${C_COMPILER:gcc}
remoteprep.execution.cpp-compiler=${CPP_COMPILER:g++}
remoteprep.execution.python-runtime=${PYTHON_RUNTIME:python}
remoteprep.execution.timeout-ms=${EXECUTION_TIMEOUT_MS:5000}
remoteprep.execution.compile-timeout-ms=${COMPILE_TIMEOUT_MS:10000}
remoteprep.execution.max-output-bytes=${MAX_OUTPUT_BYTES:1048576}
remoteprep.execution.temp-dir=${REMOTEPREP_TEMP_DIR:${java.io.tmpdir}/remoteprep-executions}
