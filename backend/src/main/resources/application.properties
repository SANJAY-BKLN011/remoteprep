# Server Configuration
server.port=8080

# CORS Configuration
# In development, allows local frontend dev servers (Live Server on 5500, dev servers on 3000, Spring Boot on 8080)
remoteprep.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080}

# MySQL Database DataSource Configuration
# Environment variables with default fallbacks ensure credentials are never committed
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:remoteprep}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'validate' verifies that the Java @Entity models match existing MySQL tables without altering schema
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Code Execution Engine Configuration
remoteprep.execution.java-compiler=${JAVA_COMPILER:javac}
remoteprep.execution.java-runtime=${JAVA_RUNTIME:java}
remoteprep.execution.c-compiler=${C_COMPILER:gcc}
remoteprep.execution.cpp-compiler=${CPP_COMPILER:g++}
remoteprep.execution.python-runtime=${PYTHON_RUNTIME:python}
remoteprep.execution.timeout-ms=${EXECUTION_TIMEOUT_MS:5000}
remoteprep.execution.compile-timeout-ms=${COMPILE_TIMEOUT_MS:10000}
remoteprep.execution.max-output-bytes=${MAX_OUTPUT_BYTES:1048576}
remoteprep.execution.temp-dir=${EXECUTION_TEMP_DIR:}
